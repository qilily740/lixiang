<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>理想机</title>
  <link rel="stylesheet" href="style.css?v=20260822-55">
</head>
<body>
  <main class="desktop-scroll-wrap">
    <section class="desktop-page page-1"><div class="bg-layer"></div>
      <div class="profile-card" data-edit="profile"><div class="person-wrap">
        <div class="user-item"><div class="avatar user-avatar" data-edit="user-avatar"></div><span class="nickname-text" data-edit="user-name">U</span></div>
        <div class="love-heart" aria-label="相爱"><svg viewBox="0 0 58 24" aria-hidden="true"><path class="heartbeat-line" d="M1 12h10l3-7 5 14 5-11 4 4h29"/></svg><span>♥</span></div>
        <div class="char-item"><span class="nickname-text" data-edit="char-name">C</span><div class="avatar char-avatar" data-edit="char-avatar"></div></div>
      </div><div class="sign-text" data-edit="signature">共同个性签名</div></div>
      <div class="page1-middle">
        <div class="todo-widget" data-edit="todo"><div class="todo-title">待办</div><div class="todo-list"></div><div class="todo-new-row">点击编辑待办</div></div>
        <div class="page1-apps-grid">
        <div class="app-item" data-app-key="liaotian"><div class="app-icon"><svg viewBox="0 0 48 48"><use class="icon-day" href="icons.svg?v=20260820-3#chat-day"/><use class="icon-night" href="icons.svg?v=20260820-3#chat-night"/></svg></div><div class="app-name">聊天</div></div>
          <div class="app-item" data-app-key="ta"><div class="app-icon"><svg viewBox="0 0 48 48"><use class="icon-day" href="icons.svg?v=20260820-4#person-day"/><use class="icon-night" href="icons.svg?v=20260820-4#person-night"/></svg></div><div class="app-name">Ta</div></div>
          <div class="app-item" data-app-key="luntan"><div class="app-icon"><svg viewBox="0 0 48 48"><use class="icon-day" href="icons.svg?v=20260820-4#forum-day"/><use class="icon-night" href="icons.svg?v=20260820-4#forum-night"/></svg></div><div class="app-name">论坛</div></div>
          <div class="app-item" data-app-key="rili"><div class="app-icon"><svg viewBox="0 0 48 48"><use class="icon-day" href="icons.svg?v=20260820-4#calendar-day"/><use class="icon-night" href="icons.svg?v=20260820-4#calendar-night"/></svg></div><div class="app-name">日历</div></div>
        </div>
      </div>
    </section>
    <section class="desktop-page page-2"><div class="bg-layer"></div>
      <div class="search-wrap"><input class="search-input" placeholder="搜索…" aria-label="搜索"></div>
      <div class="photo-group" data-edit="photos"><div class="photo-card" data-edit="photo-0"></div><div class="photo-card" data-edit="photo-1"></div><div class="photo-card" data-edit="photo-2"></div></div>
      <div class="page2-apps-grid">
        <div class="app-item" data-app-key="yinyue"><div class="app-icon"><svg viewBox="0 0 48 48"><use class="icon-day" href="icons.svg?v=20260820-3#music-day"/><use class="icon-night" href="icons.svg?v=20260820-3#music-night"/></svg></div><div class="app-name">音乐</div></div>
        <div class="app-item" data-app-key="doubao"><div class="app-icon"><svg viewBox="0 0 48 48"><use class="icon-day" href="icons.svg?v=20260822-1#doubao-day"/><use class="icon-night" href="icons.svg?v=20260822-1#doubao-night"/></svg></div><div class="app-name">豆包</div></div>
        <div class="app-item" data-app-key="gouwu"><div class="app-icon"><svg viewBox="0 0 48 48"><use class="icon-day" href="icons.svg?v=20260820-3#shop-day"/><use class="icon-night" href="icons.svg?v=20260820-3#shop-night"/></svg></div><div class="app-name">购物</div></div>
        <div class="app-item" data-app-key="ifshikong"><div class="app-icon"><svg viewBox="0 0 48 48"><use class="icon-day" href="icons.svg?v=20260820-3#space-day"/><use class="icon-night" href="icons.svg?v=20260820-3#space-night"/></svg></div><div class="app-name">if时空</div></div>
      </div>
      <div class="date-calendar-card" data-edit="calendar"><div class="date-calendar-image" data-edit="calendar-image"></div><div class="date-calendar-left"><div class="date-calendar-year"></div><div class="date-calendar-month-day"></div><div class="date-calendar-weekday"></div></div><div class="date-calendar-note" data-edit="calendar-note">今天也值得被记住</div><div class="date-calendar-right"><div class="calendar-header"><span>S</span><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span></div><div class="calendar-days"></div></div></div>
    </section>
  </main>
  <div class="page-indicator"><span class="dot active"></span><span class="dot"></span></div>
  <nav class="dock-bar" aria-label="Dock">
    <div class="dock-item" data-app-key="shezhi"><div class="dock-icon"><svg viewBox="0 0 48 48"><use class="icon-day" href="icons.svg?v=20260820-3#settings-day"/><use class="icon-night" href="icons.svg?v=20260820-3#settings-night"/></svg></div><div class="dock-name">设置</div></div>
    <div class="dock-item" data-app="meihua" data-app-key="meihua"><div class="dock-icon"><svg viewBox="0 0 48 48"><use class="icon-day" href="icons.svg?v=20260820-3#beauty-day"/><use class="icon-night" href="icons.svg?v=20260820-3#beauty-night"/></svg></div><div class="dock-name">美化</div></div>
    <div class="dock-item" data-app-key="shijieshu"><div class="dock-icon"><svg viewBox="0 0 48 48"><use class="icon-day" href="icons.svg?v=20260820-3#world-day"/><use class="icon-night" href="icons.svg?v=20260820-3#world-night"/></svg></div><div class="dock-name">世界书</div></div>
    <div class="dock-item" data-app-key="qinglvkongjian"><div class="dock-icon"><svg viewBox="0 0 48 48"><use class="icon-day" href="icons.svg?v=20260820-3#couple-day"/><use class="icon-night" href="icons.svg?v=20260820-3#couple-night"/></svg></div><div class="dock-name">情侣空间</div></div>
  </nav>
  <div class="edit-modal" id="editModal" aria-hidden="true">
    <div class="edit-backdrop" data-edit-close></div>
    <section class="edit-sheet" role="dialog" aria-modal="true" aria-labelledby="editTitle">
      <div class="edit-sheet-header"><h2 id="editTitle">编辑</h2><button class="edit-close" type="button" data-edit-close aria-label="关闭">×</button></div>
      <div class="edit-form" id="editForm"></div>
      <div class="edit-actions"><button class="edit-cancel" type="button" data-edit-close>取消</button><button class="edit-save" id="editSave" type="button">保存</button></div>
    </section>
  </div>
  <script src="app.js?v=20260820-4"></script>
  <script src="apps/shezhi.js?v=20260822-2"></script>
  <script src="apps/meihua.js?v=20260820-4"></script>
  <script src="apps/shijieshu.js?v=20260820-4"></script>
  <script src="apps/qinglvkongjian.js?v=20260822-13"></script>
  <script src="apps/liaotian.js?v=20260822-1"></script>
  <script src="apps/ta.js?v=20260820-4"></script>
  <script src="apps/luntan.js?v=20260820-4"></script>
  <script src="apps/rili.js?v=20260822-1"></script>
  <script src="apps/yinyue.js?v=20260822-49"></script>
  <script src="apps/doubao.js?v=20260822-4"></script>
  <script src="apps/gouwu.js?v=20260822-4"></script>
  <script src="apps/ifshikong.js?v=20260820-4"></script>
</body>
</html>
